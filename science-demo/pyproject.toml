[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "science-demo"
version = "0.1.0"
description = "Demo science package."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8",
    "pydantic>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
