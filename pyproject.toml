[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "science-mcp-server-starter"
version = "0.1.0"
description = "Minimal MCP server starter that exposes science package functions as tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.27,<2",
    "matplotlib>=3.8",
    "pydantic>=2,<3",
]

[tool.mcp-server]
tool_modules = ["science_demo"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_server*", "science_demo*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
