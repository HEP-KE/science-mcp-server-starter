name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff pytest

      - name: Lint with ruff
        run: ruff check .

      - name: Import check
        run: |
          python -c "from science_demo import plot_sine_wave, generate_random_points"
          python -c "from mcp_server import create_server"

      - name: Run tests (if present)
        run: |
          if [ -d tests ] && [ "$(find tests -name 'test_*.py' | head -1)" ]; then
            pytest tests/ -v
          else
            echo "No tests found — skipping"
          fi
